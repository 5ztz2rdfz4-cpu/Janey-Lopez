<!doctype html>
<html><head><meta charset="utf-8"><title>Wanita Muda & Politik</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// =====================================================================
//  WANITA MUDA & POLITIK — 90s animated infographic documentary
//  Deterministic renderer: draw(t) paints frame at time t (seconds).
//  Timings come from build/timeline.json (original speaker audio edit).
// =====================================================================
const W = 1080, H = 1920;
const cv = document.getElementById('c'), X = cv.getContext('2d');
const C = {
  n0: '#040A16', n1: '#081731', n2: '#0E2448', n3: '#17386B', n4: '#24508F',
  gold: '#D8B25A', gold2: '#F4D58D', goldD: '#9C7A2E',
  lb: '#8CC4F0', lb2: '#CFE7FB', white: '#FFFFFF', ink: '#0A1A33',
  skin: ['#EBC39E', '#D9A77C', '#C08A5E', '#F1D1B4', '#A8744B'],
};
const FD = '"Inter Display", Inter, sans-serif', FS = 'Caladea, "DejaVu Serif", serif';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => (t = clamp(t), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eOut = t => 1 - Math.pow(1 - clamp(t), 3);
const eBack = t => { t = clamp(t); const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const P = (t, t0, d) => clamp((t - t0) / d);
const fade = (t, a, b, fi = .4, fo = .4) => Math.min(P(t, a, fi), 1 - P(t, b - fo, fo));
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// offscreen layers for scenes (so transitions can scale/fade a whole scene)
function mk() { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; }
const LA = mk(), LB = mk();

// ---------------- primitives ----------------
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function glow(c, x, y, r, col, a = 1) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.save(); c.globalAlpha *= a; c.fillStyle = g; c.fillRect(x - r, y - r, 2 * r, 2 * r); c.restore();
}
function text(c, s, x, y, o = {}) {
  const { size = 60, weight = 800, color = C.white, align = 'center', font = FD, ls = 0, a = 1, base = 'alphabetic', shadow = 0, italic = false } = o;
  c.save(); c.globalAlpha *= a;
  c.font = `${italic ? 'italic ' : ''}${weight} ${size}px ${font}`; c.textAlign = align; c.textBaseline = base;
  c.letterSpacing = ls + 'px'; c.fillStyle = color;
  if (shadow) { c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = shadow; c.shadowOffsetY = shadow / 4; }
  c.fillText(s, x, y); c.restore();
}
function measure(c, s, size, weight = 800, font = FD, ls = 0) {
  c.save(); c.font = `${weight} ${size}px ${font}`; c.letterSpacing = ls + 'px'; const w = c.measureText(s).width; c.restore(); return w;
}
// kinetic headline: words [{w,col}] laid out centred, wrapped to maxW; each word rises in at its own time
function kinetic(c, words, cx, y, o = {}) {
  const { size = 92, weight = 900, lh = 1.08, maxW = 940, t = 0, ls = -1, font = FD, a = 1, align = 'center' } = o;
  const sp = measure(c, ' ', size, weight, font, ls);
  const lines = [[]]; let lw = 0;
  for (const wd of words) {
    const w = measure(c, wd.w, size, weight, font, ls);
    if (lw + w > maxW && lines[lines.length - 1].length) { lines.push([]); lw = 0; }
    lines[lines.length - 1].push({ ...wd, width: w }); lw += w + sp;
  }
  lines.forEach((ln, li) => {
    const tot = ln.reduce((s, q) => s + q.width, 0) + sp * (ln.length - 1);
    let x = align === 'center' ? cx - tot / 2 : cx;
    const yy = y + li * size * lh;
    for (const wd of ln) {
      const p = eOut(P(t, wd.t, .45));
      if (p > 0) {
        c.save(); c.beginPath(); c.rect(x - 20, yy - size * 1.05, wd.width + 40, size * 1.35); c.clip();
        text(c, wd.w, x, yy + (1 - p) * size * .9, { size, weight, color: wd.col || C.white, align: 'left', ls, a: a * p, font, italic: wd.it });
        c.restore();
        if (wd.ul) { // gold underline sweep
          const q = eOut(P(t, wd.t + .3, .5));
          c.save(); c.globalAlpha *= a; c.fillStyle = C.gold; c.fillRect(x, yy + size * .16, wd.width * q, Math.max(4, size * .06)); c.restore();
        }
      }
      x += wd.width + sp;
    }
  });
  return lines.length * size * lh;
}
const W_ = (s, t0, dt = .09, col, extra = {}) => s.split(' ').map((w, i) => ({ w, t: t0 + i * dt, col, ...extra }));

function kicker(c, s, x, y, t, t0, col = C.gold, a = 1) { // small label with line
  const p = eOut(P(t, t0, .5)); if (p <= 0) return;
  const w = measure(c, s, 30, 700, FD, 6);
  c.save(); c.globalAlpha *= a * p;
  c.fillStyle = col; c.fillRect(x - w / 2 - 70 * p, y - 11, 46 * p, 3); c.fillRect(x + w / 2 + 24, y - 11, 46 * p, 3);
  c.restore();
  text(c, s, x, y, { size: 30, weight: 700, color: col, ls: 6, a: a * p });
}

// ---------------- illustrations ----------------
// Woman bust (flat vector, respectful, no facial detail). origin = bottom-centre of shoulders
function bust(c, x, y, s, o = {}) {
  const { hijab = C.n4, top = '#F3F5F9', jacket = C.n3, skin = C.skin[0], hair = null, a = 1, rim = 0 } = o;
  c.save(); c.translate(x, y); c.scale(s, s); c.globalAlpha *= a;
  // body / blazer
  c.fillStyle = jacket; c.beginPath();
  c.moveTo(-135, 0); c.bezierCurveTo(-135, -70, -110, -105, -60, -112); c.lineTo(60, -112); c.bezierCurveTo(110, -105, 135, -70, 135, 0); c.closePath(); c.fill();
  c.fillStyle = top; c.beginPath(); c.moveTo(-34, -112); c.lineTo(0, -10); c.lineTo(34, -112); c.closePath(); c.fill();
  if (hijab) {
    c.fillStyle = hijab; c.beginPath(); // drape
    c.moveTo(-64, -190); c.bezierCurveTo(-92, -120, -86, -70, -40, -52); c.quadraticCurveTo(0, -40, 40, -52);
    c.bezierCurveTo(86, -70, 92, -120, 64, -190); c.closePath(); c.fill();
    c.beginPath(); c.ellipse(0, -205, 66, 74, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = skin; c.beginPath(); c.ellipse(0, -192, 40, 50, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = hijab; c.beginPath(); c.ellipse(0, -246, 50, 22, 0, 0, Math.PI * 2); c.fill(); // brow line of scarf
  } else {
    c.fillStyle = hair || '#2B1B14';
    c.beginPath(); c.ellipse(0, -200, 58, 66, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.moveTo(-58, -200); c.quadraticCurveTo(-70, -120, -50, -100); c.lineTo(50, -100); c.quadraticCurveTo(70, -120, 58, -200); c.fill();
    c.fillStyle = skin; c.fillRect(-16, -150, 32, 40);
    c.beginPath(); c.ellipse(0, -190, 40, 50, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = hair || '#2B1B14'; c.beginPath(); c.ellipse(-6, -236, 46, 20, -.25, 0, Math.PI * 2); c.fill();
  }
  if (rim) { // gold rim light on right edge
    c.globalCompositeOperation = 'source-atop';
    const g = c.createLinearGradient(40, 0, 140, 0); g.addColorStop(0, 'rgba(244,213,141,0)'); g.addColorStop(1, `rgba(244,213,141,${rim})`);
    c.fillStyle = g; c.fillRect(-150, -300, 300, 310);
  }
  c.restore();
}
// full figure; origin = feet. walk = phase (radians) or null
function figure(c, x, y, h, o = {}) {
  const { hijab = C.n4, body = C.n3, skirt = null, skin = C.skin[0], walk = null, a = 1, sil = null, bag = false, child = false } = o;
  const s = h / 400; c.save(); c.translate(x, y); c.scale(s, s); c.globalAlpha *= a;
  const col = k => sil || k;
  const sw = walk == null ? 0 : Math.sin(walk);
  // legs
  c.strokeStyle = col('#1B2232'); c.lineWidth = 26; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-14, -170); c.lineTo(-14 + sw * 34, -10); c.moveTo(14, -170); c.lineTo(14 - sw * 34, -10); c.stroke();
  // body (long coat / baju kurung)
  c.fillStyle = col(body); c.beginPath();
  c.moveTo(-46, -300); c.quadraticCurveTo(-58, -200, -70, -120); c.lineTo(70, -120); c.quadraticCurveTo(58, -200, 46, -300); c.closePath(); c.fill();
  if (skirt) { c.fillStyle = col(skirt); c.beginPath(); c.moveTo(-62, -130); c.lineTo(-78, -40); c.lineTo(78, -40); c.lineTo(62, -130); c.fill(); }
  // arms
  c.strokeStyle = col(body); c.lineWidth = 24;
  c.beginPath(); c.moveTo(-42, -290); c.lineTo(-56 - sw * 18, -175); c.moveTo(42, -290); c.lineTo(56 + sw * 18, -175); c.stroke();
  if (bag) { c.fillStyle = col(C.gold); rr(c, 52 + sw * 18, -180, 40, 46, 6); c.fill(); }
  // head + hijab
  if (hijab) {
    c.fillStyle = col(hijab); c.beginPath(); c.moveTo(-40, -340); c.quadraticCurveTo(-58, -280, -50, -262); c.lineTo(50, -262); c.quadraticCurveTo(58, -280, 40, -340); c.fill();
    c.beginPath(); c.arc(0, -350, 40, 0, Math.PI * 2); c.fill();
    if (!sil) { c.fillStyle = skin; c.beginPath(); c.ellipse(0, -344, 24, 29, 0, 0, Math.PI * 2); c.fill(); }
  } else {
    c.fillStyle = col('#2B1B14'); c.beginPath(); c.arc(0, -352, 38, 0, Math.PI * 2); c.fill();
    if (!sil) { c.fillStyle = skin; c.beginPath(); c.ellipse(0, -342, 25, 30, 0, 0, Math.PI * 2); c.fill(); }
  }
  c.restore();
}
function person(c, x, y, s, col, a = 1) { // simple icon person
  c.save(); c.globalAlpha *= a; c.fillStyle = col; c.translate(x, y); c.scale(s, s);
  c.beginPath(); c.arc(0, -62, 18, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.moveTo(-30, 0); c.quadraticCurveTo(-30, -38, 0, -40); c.quadraticCurveTo(30, -38, 30, 0); c.fill();
  c.restore();
}
function womanIcon(c, x, y, s, col, a = 1) {
  c.save(); c.globalAlpha *= a; c.fillStyle = col; c.translate(x, y); c.scale(s, s);
  c.beginPath(); c.arc(0, -64, 20, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.moveTo(-20, -66); c.quadraticCurveTo(-26, -40, -34, 0); c.lineTo(34, 0); c.quadraticCurveTo(26, -40, 20, -66); c.fill();
  c.restore();
}
// Parliament-inspired silhouette: tall finned tower + long podium with serrated pyramid roofs
function parliament(c, cx, by, s, o = {}) {
  const { reveal = 1, fill = C.n2, line = C.gold, lights = 0, a = 1, lw = 3 } = o;
  c.save(); c.globalAlpha *= a; c.translate(cx, by); c.scale(s, s);
  const topY = -640;
  c.beginPath(); c.rect(-560, topY + (1 - reveal) * 700 - 10, 1120, 720); c.clip();
  // tower
  const tx = 90, tw = 190, th = 600;
  c.fillStyle = fill; c.fillRect(tx, -th, tw, th);
  c.strokeStyle = line; c.lineWidth = lw; c.strokeRect(tx, -th, tw, th);
  c.globalAlpha *= .55; c.lineWidth = lw * .6;
  for (let i = 1; i < 10; i++) { c.beginPath(); c.moveTo(tx + i * tw / 10, -th + 14); c.lineTo(tx + i * tw / 10, -150); c.stroke(); }
  for (let j = 1; j < 17; j++) { c.beginPath(); c.moveTo(tx, -th + j * 28); c.lineTo(tx + tw, -th + j * 28); c.stroke(); }
  c.globalAlpha /= .55;
  if (lights > 0) { const r = rng(7); for (let j = 1; j < 16; j++) for (let i = 0; i < 10; i++) if (r() < .35) { c.fillStyle = `rgba(244,213,141,${lights * (.4 + r() * .6)})`; c.fillRect(tx + i * tw / 10 + 4, -th + j * 28 + 6, tw / 10 - 8, 14); } }
  // podium
  const pw = 1000, ph = 150;
  c.fillStyle = fill; c.fillRect(-pw / 2, -ph, pw, ph); c.lineWidth = lw; c.strokeRect(-pw / 2, -ph, pw, ph);
  const n = 11, rw = pw / n;
  for (let i = 0; i < n; i++) {
    const x0 = -pw / 2 + i * rw; c.beginPath(); c.moveTo(x0, -ph); c.lineTo(x0 + rw / 2, -ph - 58); c.lineTo(x0 + rw, -ph); c.closePath(); c.fill(); c.stroke();
  }
  c.globalAlpha *= .5; for (let i = 0; i < 24; i++) { const x0 = -pw / 2 + 20 + i * (pw - 40) / 23; c.beginPath(); c.moveTo(x0, -ph + 20); c.lineTo(x0, -10); c.stroke(); }
  if (lights > 0) { c.globalAlpha = a * lights * .9; c.fillStyle = C.gold2; for (let i = 0; i < 23; i++) { c.fillRect(-pw / 2 + 26 + i * (pw - 40) / 23, -ph + 30, 30, 90); } }
  c.restore();
  if (reveal < 1 && reveal > 0) { // scanning line
    const y = by + s * (topY + (1 - reveal) * 700 - 10);
    c.save(); c.globalAlpha *= a; const g = c.createLinearGradient(cx - 600 * s, 0, cx + 600 * s, 0);
    g.addColorStop(0, 'rgba(140,196,240,0)'); g.addColorStop(.5, 'rgba(140,196,240,.9)'); g.addColorStop(1, 'rgba(140,196,240,0)');
    c.fillStyle = g; c.fillRect(cx - 600 * s, y - 2, 1200 * s, 4); c.restore();
  }
}
// ---- icons (centred at 0,0, ~100px box), stroke-based ----
function icon(c, kind, x, y, s, col = C.gold, a = 1, lw = 7) {
  c.save(); c.translate(x, y); c.scale(s, s); c.globalAlpha *= a;
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round';
  const L = (pts, close) => { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(...p) : c.moveTo(...p)); if (close) c.closePath(); c.stroke(); };
  switch (kind) {
    case 'people': person(c, -28, 40, .9, col); person(c, 28, 40, .9, col); person(c, 0, 48, 1.05, col); break;
    case 'bulb': c.beginPath(); c.arc(0, -12, 30, Math.PI * .8, Math.PI * 2.2); c.stroke(); L([[-14, 20], [-14, 34], [14, 34], [14, 20]]); L([[-10, 46], [10, 46]]);
      for (let i = 0; i < 5; i++) { const an = -Math.PI / 2 + (i - 2) * .55; L([[Math.cos(an) * 44, -12 + Math.sin(an) * 44], [Math.cos(an) * 56, -12 + Math.sin(an) * 56]]); } break;
    case 'doc': L([[-30, -44], [14, -44], [32, -26], [32, 44], [-30, 44]], true); L([[-16, -18], [18, -18]]); L([[-16, 0], [18, 0]]); L([[-16, 18], [8, 18]]); break;
    case 'rise': L([[-40, 40], [40, 40]]); L([[-34, 24], [-10, 0], [8, 14], [36, -22]]); L([[18, -24], [36, -22], [34, -4]]); break;
    case 'grad': L([[-46, -10], [0, -32], [46, -10], [0, 12]], true); L([[-26, 2], [-26, 26], [0, 38], [26, 26], [26, 2]]); L([[46, -10], [46, 24]]); break;
    case 'chart': L([[-42, 42], [42, 42]]); c.fillRect(-36, 10, 18, 30); c.fillRect(-9, -8, 18, 48); c.fillRect(18, -32, 18, 72); break;
    case 'ballot': L([[-42, 4], [42, 4], [42, 46], [-42, 46]], true); L([[-18, 4], [18, 4]]); break;
    case 'star': c.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? 18 : 42, an = -Math.PI / 2 + i * Math.PI / 5; c.lineTo(Math.cos(an) * r, Math.sin(an) * r); } c.closePath(); c.stroke(); break;
    case 'eye': c.beginPath(); c.moveTo(-48, 0); c.quadraticCurveTo(0, -42, 48, 0); c.quadraticCurveTo(0, 42, -48, 0); c.stroke(); c.beginPath(); c.arc(0, 0, 14, 0, 7); c.fill(); break;
    case 'scale': L([[0, -40], [0, 40]]); L([[-26, 40], [26, 40]]); L([[-42, -26], [42, -26]]);
      c.beginPath(); c.arc(-42, 2, 16, 0, Math.PI); c.stroke(); c.beginPath(); c.arc(42, 2, 16, 0, Math.PI); c.stroke(); L([[-42, -26], [-56, 2]]); L([[-42, -26], [-28, 2]]); L([[42, -26], [28, 2]]); L([[42, -26], [56, 2]]); break;
    case 'shield': c.beginPath(); c.moveTo(0, -46); c.lineTo(38, -30); c.quadraticCurveTo(38, 24, 0, 46); c.quadraticCurveTo(-38, 24, -38, -30); c.closePath(); c.stroke(); L([[-14, 0], [-2, 12], [18, -12]]); break;
    case 'coin': c.beginPath(); c.arc(0, 0, 40, 0, 7); c.stroke(); text(c, 'RM', 0, 13, { size: 34, weight: 800, color: col }); break;
    case 'mic': rr(c, -14, -44, 28, 52, 14); c.stroke(); c.beginPath(); c.arc(0, -6, 26, 0, Math.PI); c.stroke(); L([[0, 20], [0, 40]]); L([[-16, 40], [16, 40]]); break;
    case 'home': L([[-44, -2], [0, -40], [44, -2]]); L([[-32, -10], [-32, 40], [32, 40], [32, -10]]); L([[-10, 40], [-10, 14], [10, 14], [10, 40]]); break;
    case 'heart': c.beginPath(); c.moveTo(0, 36); c.bezierCurveTo(-60, -6, -30, -50, 0, -20); c.bezierCurveTo(30, -50, 60, -6, 0, 36); c.stroke(); break;
    case 'brief': rr(c, -44, -22, 88, 62, 8); c.stroke(); L([[-16, -22], [-16, -36], [16, -36], [16, -22]]); L([[-44, 4], [44, 4]]); break;
  }
  c.restore();
}
function chip(c, x, y, w, h, label, ic, t, t0, o = {}) { // infographic card
  const p = eBack(P(t, t0, .55)), q = P(t, t0, .3); if (q <= 0) return;
  const { num = null, col = C.gold, size = 40 } = o;
  c.save(); c.globalAlpha *= q; c.translate(x, y); c.scale(.8 + .2 * p, .8 + .2 * p);
  const g = c.createLinearGradient(-w / 2, 0, w / 2, 0); g.addColorStop(0, 'rgba(23,56,107,.92)'); g.addColorStop(1, 'rgba(14,36,72,.92)');
  c.fillStyle = g; rr(c, -w / 2, -h / 2, w, h, 26); c.fill();
  c.strokeStyle = 'rgba(216,178,90,.65)'; c.lineWidth = 2.5; rr(c, -w / 2, -h / 2, w, h, 26); c.stroke();
  c.fillStyle = col; c.fillRect(-w / 2 + 2, -h / 2 + 22, 6, h - 44);
  if (ic) icon(c, ic, -w / 2 + 80, 0, .78 * h / 130, col, 1, 7);
  if (num) text(c, num, w / 2 - 28, -h / 2 + 42, { size: 26, weight: 700, color: 'rgba(207,231,251,.55)', align: 'right', ls: 2 });
  text(c, label, -w / 2 + (ic ? 150 : 40), 0, { size, weight: 800, color: C.white, align: 'left', base: 'middle', ls: 1 });
  c.restore();
}
function arrowV(c, x, y0, y1, p, col = C.gold, a = 1) { // animated arrow down
  if (p <= 0) return; const y = lerp(y0, y1, eOut(p));
  c.save(); c.globalAlpha *= a; c.strokeStyle = col; c.lineWidth = 5; c.setLineDash([12, 10]); c.lineDashOffset = -p * 60;
  c.beginPath(); c.moveTo(x, y0); c.lineTo(x, y); c.stroke(); c.setLineDash([]);
  if (p > .7) { c.fillStyle = col; c.beginPath(); c.moveTo(x - 14, y - 16); c.lineTo(x + 14, y - 16); c.lineTo(x, y); c.fill(); }
  c.restore();
}
function bubble(c, x, y, w, h, t, t0, o = {}) { // speech bubble with dots / icon
  const p = eBack(P(t, t0, .5)), q = P(t, t0, .25); if (q <= 0) return;
  const { col = C.lb2, ic = null, tail = 'left', a = 1, fillA = .95 } = o;
  c.save(); c.globalAlpha *= q * a; c.translate(x, y); c.scale(p, p);
  c.fillStyle = col; c.globalAlpha *= fillA; rr(c, -w / 2, -h / 2, w, h, h / 2.4); c.fill();
  c.beginPath(); const tx = tail === 'left' ? -w / 2 + 34 : w / 2 - 34; c.moveTo(tx - 12, h / 2 - 4); c.lineTo(tx + (tail === 'left' ? -18 : 18), h / 2 + 22); c.lineTo(tx + 14, h / 2 - 4); c.fill();
  c.globalAlpha /= fillA;
  if (ic) icon(c, ic, 0, 0, h / 150, C.ink, 1, 8);
  else for (let i = 0; i < 3; i++) { c.fillStyle = C.ink; c.globalAlpha = q * a * (.5 + .5 * Math.sin(t * 6 - i)); c.beginPath(); c.arc((i - 1) * h * .28, 0, h * .08, 0, 7); c.fill(); }
  c.restore();
}
function paper(c, x, y, s, rot, a = 1, gold = false) { // policy document
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s); c.globalAlpha *= a;
  c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 20; c.shadowOffsetY = 8;
  c.fillStyle = '#F4F7FB'; rr(c, -70, -92, 140, 184, 10); c.fill(); c.shadowColor = 'transparent';
  c.fillStyle = gold ? C.gold : C.n3; c.fillRect(-48, -66, 96, 12);

// ---------------- background (shared, continuous) ----------------
const DUST = (() => { const r = rng(42); return Array.from({ length: 70 }, () => ({ x: r() * W, y: r() * H, z: .3 + r() * .7, ph: r() * 6.28 })); })();
function background(c, t) {
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, C.n0); g.addColorStop(.5, C.n1); g.addColorStop(1, C.n0);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // slow moving light pools
  glow(c, W * (.3 + .1 * Math.sin(t * .11)), H * .32, 900, 'rgba(36,80,143,.55)');
  glow(c, W * (.8 + .08 * Math.cos(t * .09)), H * .7, 800, 'rgba(23,56,107,.6)');
  // infographic grid
  c.save(); c.strokeStyle = 'rgba(140,196,240,.05)'; c.lineWidth = 1;
  const off = (t * 8) % 90;
  for (let x = -90 + off; x < W; x += 90) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }
  for (let y = -90 + off; y < H; y += 90) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  c.restore();
  for (const d of DUST) {
    const y = (d.y - t * 14 * d.z + H * 10) % H, x = d.x + Math.sin(t * .4 + d.ph) * 20;
    c.fillStyle = `rgba(207,231,251,${.10 + .25 * d.z * (.5 + .5 * Math.sin(t + d.ph))})`;
    c.beginPath(); c.arc(x, y, 1.2 + 2.2 * d.z, 0, 7); c.fill();
  }
}
function rays(c, x, y, t, a = 1, col = '244,213,141') { // cinematic light shafts
  c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = a;
  for (let i = 0; i < 7; i++) {
    const an = Math.PI / 2 + (i - 3) * .17 + Math.sin(t * .3 + i) * .03, len = 1800;
    const g = c.createLinearGradient(x, y, x + Math.cos(an) * len, y + Math.sin(an) * len);
    g.addColorStop(0, `rgba(${col},.16)`); g.addColorStop(1, `rgba(${col},0)`);
    c.fillStyle = g; c.beginPath(); c.moveTo(x, y);
    c.lineTo(x + Math.cos(an - .05) * len, y + Math.sin(an - .05) * len); c.lineTo(x + Math.cos(an + .05) * len, y + Math.sin(an + .05) * len); c.fill();
  }
  c.restore();
}
function camera(c, t, t0, t1, z0 = 1, z1 = 1.06, dx = 0, dy = 0) {
  const p = ease(P(t, t0, t1 - t0)), z = lerp(z0, z1, p);
  c.translate(W / 2 + dx * p, H / 2 + dy * p); c.scale(z, z); c.translate(-W / 2, -H / 2);
}

// ---------------- overlays ----------------
function subtitles(c, t) {
  if (!SUBS) return;
  const ch = SUBS.find(s => t >= s.t0 && t < s.t1); if (!ch) return;
  const a = Math.min(P(t, ch.t0, .12), 1 - P(t, ch.t1 - .1, .1));
  const size = 50, y = 1560;
  const words = ch.words.map(w => ({ ...w, w: w.w }));
  c.save(); c.font = `800 ${size}px ${FD}`; c.letterSpacing = '0px';
  const sp = c.measureText(' ').width, ws = words.map(w => c.measureText(w.w).width);
  const tot = ws.reduce((s, q) => s + q, 0) + sp * (ws.length - 1);
  c.globalAlpha = a * .62; c.fillStyle = '#030814'; rr(c, W / 2 - tot / 2 - 34, y - size - 14, tot + 68, size + 46, 20); c.fill();
  c.globalAlpha = a; let x = W / 2 - tot / 2;
  words.forEach((w, i) => {
    const on = t >= w.t0 - .04;
    text(c, w.w, x, y, { size, weight: 800, align: 'left', color: on ? (t < w.t1 + .05 ? C.gold2 : C.white) : 'rgba(255,255,255,.55)' });
    x += ws[i] + sp;
  });
  c.restore();
}
function badge(c, t) { // persistent speaker badge after the intro card
  const a = P(t, 5.4, .6) * (1 - P(t, 84.8, .5)); if (a <= 0 || !PHOTO) return;
  c.save(); c.globalAlpha = a * .95; const x = 92, y = 150;
  c.fillStyle = 'rgba(4,10,22,.55)'; rr(c, x - 50, y - 46, 430, 92, 46); c.fill();
  c.beginPath(); c.arc(x, y, 38, 0, 7); c.save(); c.clip(); c.drawImage(PHOTO, x - 38, y - 38, 76, 76); c.restore();
  c.strokeStyle = C.gold; c.lineWidth = 3; c.beginPath(); c.arc(x, y, 40, 0, 7); c.stroke();
  text(c, 'NURUL JANNAH', x + 56, y - 2, { size: 28, weight: 800, align: 'left', ls: 1.5 });
  text(c, 'Perkongsian asal', x + 56, y + 30, { size: 22, weight: 500, align: 'left', color: C.lb });
  // live audio bars
  for (let i = 0; i < 4; i++) { const h = 8 + 14 * Math.abs(Math.sin(t * 9 + i * 1.3)); c.fillStyle = C.gold; c.fillRect(x + 326 + i * 9, y - h / 2, 5, h); }
  c.restore();
}
function vignette(c) {
  const g = c.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)'); c.fillStyle = g; c.fillRect(0, 0, W, H);
}
const GR = (() => { const g = mk(); g.width = 256; g.height = 256; const gc = g.getContext('2d'); const id = gc.createImageData(256, 256); const r = rng(5);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 10; } gc.putImageData(id, 0, 0); return g; })();
function grain(c, t) { const p = c.createPattern(GR, 'repeat'); c.save(); c.translate((t * 997) % 256, (t * 613) % 256); c.fillStyle = p; c.fillRect(-256, -256, W + 512, H + 512); c.restore(); }
function sweep(c, t) { // light streak at each scene cut
  for (let i = 1; i < SC.length; i++) {
    const b = (SC[i][1] + SC[i - 1][2]) / 2, p = P(t, b - .35, .7);
    if (p <= 0 || p >= 1) continue;
    const y = lerp(-200, H + 200, ease(p));
    c.save(); c.globalCompositeOperation = 'lighter'; c.translate(W / 2, y); c.rotate(-.18);
    const g = c.createLinearGradient(0, -90, 0, 90); g.addColorStop(0, 'rgba(244,213,141,0)'); g.addColorStop(.5, `rgba(244,213,141,${.45 * Math.sin(p * Math.PI)})`); g.addColorStop(1, 'rgba(244,213,141,0)');
    c.fillStyle = g; c.fillRect(-W, -90, 2 * W, 180);
    c.fillStyle = `rgba(255,255,255,${.6 * Math.sin(p * Math.PI)})`; c.fillRect(-W, -1.5, 2 * W, 3); c.restore();
  }
}

// ---------------- main ----------------
function draw(t) {
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.globalCompositeOperation = 'source-over';
  background(X, t);
  const act = SC.filter(s => t >= s[1] && t < s[2]);
  act.forEach((s, k) => {
    const L = k ? LB : LA, c = L.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, W, H); c.globalAlpha = 1;
    S[s[0]](c, t);
    const fi = s[1] <= 0 ? 1 : ease(P(t, s[1], .6)), fo = 1 - ease(P(t, s[2] - .6, .6));
    const a = Math.min(fi, fo), z = fi < 1 ? lerp(.94, 1, fi) : lerp(1, 1.08, 1 - fo);
    X.save(); X.globalAlpha = a; X.translate(W / 2, H / 2); X.scale(z, z); X.translate(-W / 2, -H / 2);
    if (a < 1) X.filter = `blur(${(1 - a) * 10}px)`;
    X.drawImage(L, 0, 0); X.restore(); X.filter = 'none';
  });
  sweep(X, t);
  vignette(X);
  badge(X, t);
  subtitles(X, t);
  grain(X, t);
  // global fade in / out
  const fo = Math.max(1 - P(t, 0, .5), P(t, 88.6, 1.35));
  if (fo > 0) { X.fillStyle = `rgba(0,0,0,${fo})`; X.fillRect(0, 0, W, H); }
}
